server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name freshmark.sunisalex.org;

    ssl_certificate /etc/letsencrypt/live/freshmark.sunisalex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshmark.sunisalex.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_buffer_size 4k;
    quic_retry on;
    quic_host_key /etc/nginx/quic_host.key;

    root /var/www/freshmark/current/public;
    index index.html;
    client_max_body_size 64k;

    # Keep gzip as a portable compression baseline.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/rss+xml application/xml application/xml+rss image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /api/auth/register {
        limit_req zone=freshmark_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=freshmark_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/comments/submit {
        limit_req zone=freshmark_submit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=freshmark_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* "\.freshmark-[a-f0-9]{12}-[0-9]+w\.(?:avif|webp)$" {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name freshmark.sunisalex.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/freshmark/current/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
