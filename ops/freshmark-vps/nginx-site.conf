server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freshmark.sunisalex.org;

    ssl_certificate /etc/letsencrypt/live/freshmark.sunisalex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshmark.sunisalex.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/freshmark/public;
    index index.html;
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /api/auth/register {
        limit_req zone=freshmark_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=freshmark_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/comments/submit {
        limit_req zone=freshmark_submit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=freshmark_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name freshmark.sunisalex.org;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/freshmark/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
