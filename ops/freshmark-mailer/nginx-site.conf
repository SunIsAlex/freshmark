server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.sunisalex.org;

    ssl_certificate /etc/letsencrypt/live/mail.sunisalex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sunisalex.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/freshmark-mailer.conf;

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.sunisalex.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reader;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
