<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" role="img" aria-label="图 3.26 点 P 到过 Q 点直线的距离">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="580" height="440" rx="16" fill="#ffffff"/>

  <!-- Grid / Guides -->
  <g stroke="#f0f2f5" stroke-width="1">
    <line x1="40" y1="120" x2="540" y2="120"/>
    <line x1="40" y1="320" x2="540" y2="320"/>
    <line x1="170" y1="30" x2="170" y2="400"/>
    <line x1="370" y1="30" x2="370" y2="400"/>
  </g>

  <!-- Axes -->
  <g stroke="#2c3e50" stroke-width="1.8" fill="none">
    <path d="M 40 220 H 540" marker-end="url(#arrow)"/>
    <path d="M 270 400 V 30" marker-end="url(#arrow)"/>
  </g>
  <text x="548" y="226" font-family="Times New Roman, STIX Two Math, serif" font-style="italic" font-size="22" fill="#2c3e50">x</text>
  <text x="278" y="32" font-family="Times New Roman, STIX Two Math, serif" font-style="italic" font-size="22" fill="#2c3e50">y</text>
  <text x="252" y="240" font-family="Times New Roman, STIX Two Math, serif" font-style="italic" font-size="20" fill="#2c3e50">O</text>

  <!-- Line 2x - y - 6 = 0 -->
  <!-- passes through (2,-2)->(370, 320) and (3, 0)->(420, 220), slope 2: in svg dy/dx = -2 -->
  <line x1="310" y1="440" x2="460" y2="140" stroke="#8e44ad" stroke-width="2"/>
  <text x="445" y="130" font-family="sans-serif" font-size="14" fill="#8e44ad" font-weight="bold">2x − y − 6 = 0</text>

  <!-- Line x - y - 4 = 0 (l ⊥ PQ, missing line) -->
  <!-- passes through (2,-2)->(370, 320) and (4, 0)->(470, 220), slope 1: in svg dy/dx = -1 -->
  <line x1="260" y1="430" x2="520" y2="170" stroke="#e74c3c" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="440" y="295" font-family="sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">x − y − 4 = 0 (垂直线，缺失)</text>

  <!-- Segment PQ -->
  <!-- P(-2, 2) -> (170, 120), Q(2, -2) -> (370, 320) -->
  <line x1="170" y1="120" x2="370" y2="320" stroke="#2980b9" stroke-width="2.8"/>

  <!-- Variable line l through Q -->
  <!-- e.g. passes through (370, 320) with small positive slope in xy -> negative in svg, or nearly horizontal -->
  <line x1="80" y1="365" x2="520" y2="295" stroke="#27ae60" stroke-width="2.2"/>
  <text x="65" y="375" font-family="Times New Roman, STIX Two Math, serif" font-style="italic" font-size="22" fill="#27ae60" font-weight="bold">l</text>

  <!-- Perpendicular from P to l -->
  <!-- Foot H on line l -->
  <line x1="170" y1="120" x2="192" y2="348" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- Right angle mark at H(192, 348) -->
  <path d="M 190 334 L 204 332 L 206 346" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="160" y="240" font-family="Times New Roman, STIX Two Math, serif" font-style="italic" font-size="20" fill="#7f8c8d">d</text>

  <!-- Points P and Q -->
  <circle cx="170" cy="120" r="5.5" fill="#2980b9"/>
  <text x="135" y="112" font-family="Times New Roman, STIX Two Math, serif" font-size="18" fill="#2980b9" font-weight="bold">P(−2, 2)</text>

  <circle cx="370" cy="320" r="5.5" fill="#2980b9"/>
  <text x="382" y="338" font-family="Times New Roman, STIX Two Math, serif" font-size="18" fill="#2980b9" font-weight="bold">Q(2, −2)</text>
</svg>