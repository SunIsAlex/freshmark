<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.16 的欧拉线</title><desc id="desc">三角形的外心 O、重心 G、垂心 H 位于同一直线上，G 将 OH 按一比二分割。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="780" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="736" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><circle cx="230" cy="215" r="160" fill="none" stroke="#b8c7cd" stroke-width="2"/><path d="M72 187 310 354 258 57Z" fill="#edf8f5" stroke="#17252f" stroke-width="2.4"/><path d="M72 187 180 168" stroke="#df5c4f" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M310 354 180 168" stroke="#0f8a72" stroke-width="1.8" stroke-dasharray="6 4"/><path d="M258 57 180 168" stroke="#3273b9" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M230 215 180 168" stroke="#9c6dca" stroke-width="4"/><circle cx="230" cy="215" r="5" fill="#3273b9"/><circle cx="213" cy="199" r="5" fill="#0f8a72"/><circle cx="180" cy="168" r="5" fill="#df5c4f"/><text x="55" y="184" class="m l">A</text><text x="316" y="370" class="m l">B</text><text x="253" y="45" class="m l">C</text><text x="236" y="231" class="m l">O</text><text x="212" y="190" class="m l">G</text><text x="160" y="163" class="m l">H</text><text x="154" y="238" class="s u" fill="#9c6dca">欧拉线</text>
  </g>
  <g class="s"><rect x="460" y="75" width="270" height="280" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="487" y="115" font-size="20" font-weight="700" fill="#17252f">O —— G ———— H</text><text x="487" y="151" class="u">外心　 重心　　　 垂心</text><line x1="487" y1="177" x2="704" y2="177" stroke="#cedbe1"/><text x="487" y="219" font-size="18" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">OG : GH = 1 : 2</text><text x="487" y="260" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">GH = 2 OG</text><text x="487" y="302" class="u">三心共线，且 G 靠近 O</text><text x="487" y="331" class="u">这就是三角形的欧拉线</text></g>
</svg>
