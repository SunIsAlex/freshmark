<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.13 的面积权重与奔驰定理</title><desc id="desc">三角形 ABC 内点 O 将三角形分成面积比为 4 比 3 比 2 的三个小三角形，由面积权重得到位置向量关系。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="420" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="376" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M70 330 390 330 235 75Z" fill="#fff" stroke="#17252f" stroke-width="2.4"/><path d="M210 230 70 330" fill="none" stroke="#0f8a72" stroke-width="2"/><path d="M210 230 390 330" fill="none" stroke="#0f8a72" stroke-width="2"/><path d="M210 230 235 75" fill="none" stroke="#0f8a72" stroke-width="2"/>
    <path d="M70 330 210 230" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/><path d="M70 330 390 330" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/><path d="M70 330 235 75" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/>
    <circle cx="210" cy="230" r="5" fill="#df5c4f"/><text x="53" y="354" class="m l">A</text><text x="397" y="354" class="m l">B</text><text x="226" y="63" class="m l">C</text><text x="218" y="224" class="m l">O</text>
    <text x="214" y="291" class="s" font-size="24" font-weight="700" fill="#9c6dca">4</text><text x="287" y="191" class="s" font-size="24" font-weight="700" fill="#0f8a72">3</text><text x="130" y="183" class="s" font-size="24" font-weight="700" fill="#df5c4f">2</text>
  </g>
  <g class="s"><rect x="450" y="78" width="258" height="264" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="476" y="116" font-size="18" font-weight="700" fill="#17252f">面积就是顶点的权重</text><text x="476" y="157" class="u">S₍AOB₎ : S₍BOC₎ : S₍AOC₎</text><text x="476" y="188" font-size="20" font-weight="700" fill="#0f8a72">= 4 : 3 : 2</text><line x1="476" y1="211" x2="682" y2="211" stroke="#cedbe1"/><text x="476" y="249" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">4 OC + 3 OA + 2 OB = 0</text><text x="476" y="291" font-size="17" fill="#df5c4f" font-family="Cambria Math,Times New Roman,serif">AO = ²⁄₉ AB + ⁴⁄₉ AC</text><text x="476" y="321" class="u">选择 A</text></g>
</svg>
