<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.12 的单位圆内接五边形</title><desc id="desc">单位圆上五个顶点两两连接。所有边与对角线的平方和由点系平方距离恒等式控制，当五个顶点向量和为零时达到最大值二十五；正五边形给出等号构型。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g>
    <circle cx="245" cy="220" r="145" fill="#eef7fb" stroke="#3273b9" stroke-width="2.5"/>
    <g stroke="#9c6dca" stroke-width="1.7" opacity=".9"><path d="M245 75 382.9 175.2 330.2 337.3 159.8 337.3 107.1 175.2Z" fill="none" stroke="#0f8a72" stroke-width="3"/><path d="M245 75 330.2 337.3 107.1 175.2 382.9 175.2 159.8 337.3Z" fill="none"/></g>
    <g fill="#df5c4f"><circle cx="245" cy="75" r="5"/><circle cx="382.9" cy="175.2" r="5"/><circle cx="330.2" cy="337.3" r="5"/><circle cx="159.8" cy="337.3" r="5"/><circle cx="107.1" cy="175.2" r="5"/></g><circle cx="245" cy="220" r="4.5" fill="#17252f"/>
    <text x="230" y="242" class="m l">O</text><text x="250" y="65" class="m l">P₁</text><text x="392" y="174" class="m l">P₂</text><text x="337" y="358" class="m l">P₃</text><text x="130" y="358" class="m l">P₄</text><text x="77" y="174" class="m l">P₅</text>
    <text x="160" y="397" class="s u">绿色：5 条边　紫色：5 条对角线</text>
  </g>
  <g class="s"><rect x="470" y="70" width="238" height="292" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/>
    <text x="495" y="108" font-size="18" font-weight="700" fill="#17252f">点系平方距离恒等式</text><text x="495" y="149" font-size="16" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">Σᵢ&lt;ⱼ PᵢPⱼ²</text><text x="495" y="179" class="u">= 5ΣOPᵢ² − |ΣOPᵢ|²</text>
    <text x="495" y="214" class="u">单位圆上 ΣOPᵢ²=5</text><line x1="495" y1="238" x2="682" y2="238" stroke="#cedbe1"/>
    <text x="495" y="274" class="u">当 ΣOPᵢ=0 时取最大值</text><text x="495" y="313" font-size="22" font-weight="700" fill="#df5c4f">最大值 = 25</text><text x="495" y="342" class="u">正五边形给出等号</text>
  </g>
</svg>
