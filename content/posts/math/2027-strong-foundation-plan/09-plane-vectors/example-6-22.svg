<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.22 的中点与最短距离模型</title><desc id="desc">夹角六十度、两边长分别为三 k 和二 k 的三角形，M 为 AC 中点，D 在 AB 上运动，DM 在垂足处最短。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="800" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="756" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M65 340 410 340 180 80Z" fill="#edf8f5" stroke="#17252f" stroke-width="2.4"/><path d="M65 340 410 340" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/><path d="M65 340 180 80" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/><circle cx="122.5" cy="210" r="5" fill="#df5c4f"/><path d="M122.5 210V340" stroke="#df5c4f" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M122.5 322H140.5V340" fill="none" stroke="#17252f" stroke-width="1.6"/><circle cx="122.5" cy="340" r="5" fill="#0f8a72"/><path d="M122.5 340 122.5 210" stroke="#0f8a72" stroke-width="4"/><path d="M117 340H275" stroke="#9c6dca" stroke-width="5" opacity=".45"/>
    <path d="M120 340A55 55 0 0 0 87 289" fill="none" stroke="#9c6dca" stroke-width="2"/><text x="48" y="364" class="m l">A</text><text x="417" y="364" class="m l">B</text><text x="173" y="67" class="m l">C</text><text x="103" y="202" class="m l">M</text><text x="111" y="365" class="m l">H=D</text><text x="234" y="330" class="s u">AB = 3k</text><text x="89" y="160" class="s u">AC = 2k</text><text x="92" y="292" class="m l" fill="#9c6dca">60°</text><text x="132" y="275" class="s u" fill="#df5c4f">HM = √3 k / 2</text>
  </g>
  <g class="s"><rect x="465" y="68" width="283" height="294" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="491" y="106" font-size="18" font-weight="700" fill="#17252f">极化恒等式变成距离最小</text><text x="491" y="148" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">DA·DC = DM² − MA²</text><text x="491" y="184" class="u">MA = k，D 在线段 AB 上运动</text><line x1="491" y1="207" x2="722" y2="207" stroke="#cedbe1"/><text x="491" y="245" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">min DM = HM = √3 k/2</text><text x="491" y="282" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">−k²/4 = −3 ⇒ k² = 12</text><text x="491" y="326" font-size="19" font-weight="700" fill="#df5c4f">S = 18√3</text><text x="491" y="349" class="u">最小值在 D 与垂足 H 重合时取得</text></g>
</svg>
