<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.15 的垂心与正切权重</title><desc id="desc">锐角三角形的三条高交于垂心 H，三个顶点向量按各角正切加权。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="420" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="376" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M60 330 400 330 270 68Z" fill="#fff" stroke="#17252f" stroke-width="2.4"/><path d="M270 68 270 330" stroke="#df5c4f" stroke-width="2" stroke-dasharray="6 4"/><path d="M60 330 333 195" stroke="#0f8a72" stroke-width="2" stroke-dasharray="6 4"/><path d="M400 330 193 164" stroke="#3273b9" stroke-width="2" stroke-dasharray="6 4"/><circle cx="270" cy="226" r="5" fill="#9c6dca"/>
    <path d="M270 312H288V330" fill="none" stroke="#17252f" stroke-width="1.5"/><text x="44" y="355" class="m l">A</text><text x="407" y="355" class="m l">B</text><text x="263" y="55" class="m l">C</text><text x="280" y="222" class="m l">H</text>
    <text x="126" y="303" class="s u" fill="#df5c4f">tan A = 2k</text><text x="295" y="303" class="s u" fill="#0f8a72">tan B = 3k</text><text x="281" y="111" class="s u" fill="#3273b9">tan C = 4k</text>
  </g>
  <g class="s"><rect x="455" y="72" width="253" height="276" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="480" y="110" font-size="18" font-weight="700" fill="#17252f">垂心的正切权重</text><text x="480" y="151" font-size="16" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">tan A·HA + tan B·HB</text><text x="480" y="177" font-size="16" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">+ tan C·HC = 0</text><line x1="480" y1="199" x2="682" y2="199" stroke="#cedbe1"/><text x="480" y="236" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">24k³ = 9k</text><text x="480" y="274" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">tan C = √6</text><text x="480" y="316" font-size="18" font-weight="700" fill="#df5c4f">sin C = √42 / 7</text></g>
</svg>
