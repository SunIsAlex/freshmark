<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.19 的三维直线最短距离模型</title><desc id="desc">满足约束的点 P 在三维空间中沿方向一一一的直线运动，原点到直线的垂足给出平方和的最小值。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="780" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="736" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M105 330 390 330" stroke="#9aa9b0" stroke-width="2" marker-end="url(#a)"/><path d="M105 330 105 80" stroke="#9aa9b0" stroke-width="2" marker-end="url(#a)"/><path d="M105 330 45 385" stroke="#9aa9b0" stroke-width="2" marker-end="url(#a)"/><text x="397" y="337" class="m l">x</text><text x="95" y="67" class="m l">z</text><text x="35" y="401" class="m l">y</text>
    <path d="M85 310 375 73" stroke="#0f8a72" stroke-width="4"/><circle cx="105" cy="330" r="5" fill="#17252f"/><circle cx="195" cy="220" r="6" fill="#df5c4f"/><path d="M105 330 195 220" stroke="#3273b9" stroke-width="3"/><path d="M184 229 195 238 204 227" fill="none" stroke="#17252f" stroke-width="1.6"/><text x="85" y="321" class="m l">O</text><text x="206" y="214" class="m l">P₀</text><text x="315" y="126" class="m l" fill="#0f8a72">l</text><text x="120" y="280" class="s u" fill="#3273b9">最短距离</text><text x="270" y="173" class="s u">方向 (1,1,1)</text>
  </g>
  <g class="s"><rect x="450" y="71" width="282" height="288" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="476" y="109" font-size="18" font-weight="700" fill="#17252f">约束把点限制在一条直线上</text><text x="476" y="149" class="u">P(t) = (t+1, t−√3/3, t+√3/3)</text><line x1="476" y1="174" x2="706" y2="174" stroke="#cedbe1"/><text x="476" y="214" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">OP₀ ⟂ (1,1,1)</text><text x="476" y="253" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">x + y + z = 0</text><text x="476" y="292" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">t = −⅓</text><text x="476" y="329" font-size="18" font-weight="700" fill="#df5c4f">min OP² = 4/3</text></g>
</svg>
