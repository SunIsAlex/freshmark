<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.21 的交换系数与三角不等式</title><desc id="desc">交换单位向量差中的系数后，将两段向量首尾相接，其和为二倍的 a 减 b，从而使用三角不等式。</desc>
  <defs><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#0f8a72"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#df5c4f"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="800" height="420" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="756" height="376" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><circle cx="235" cy="215" r="120" fill="none" stroke="#d5e2e0" stroke-width="2"/><path d="M235 215 175 111" stroke="#3273b9" stroke-width="3" marker-end="url(#ab)"/><path d="M235 215 355 215" stroke="#0f8a72" stroke-width="3" marker-end="url(#ag)"/><path d="M175 111 355 215" stroke="#9c6dca" stroke-width="2.5" stroke-dasharray="6 4"/><text x="218" y="240" class="m l">O</text><text x="157" y="101" class="m l" fill="#3273b9">a</text><text x="362" y="222" class="m l" fill="#0f8a72">b</text><text x="255" y="177" class="s u" fill="#9c6dca">120°</text>
    <path d="M65 355 220 305" stroke="#3273b9" stroke-width="3" marker-end="url(#ab)"/><path d="M220 305 375 255" stroke="#0f8a72" stroke-width="3" marker-end="url(#ag)"/><path d="M65 355 375 255" stroke="#df5c4f" stroke-width="3" marker-end="url(#ar)"/><text x="87" y="326" class="m l" fill="#3273b9">2a−c</text><text x="264" y="276" class="m l" fill="#0f8a72">−2b+c</text><text x="177" y="371" class="m l" fill="#df5c4f">2(a−b)</text>
  </g>
  <g class="s"><rect x="455" y="68" width="293" height="286" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="481" y="106" font-size="18" font-weight="700" fill="#17252f">交换系数，消去 c</text><text x="481" y="147" font-size="16" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">|b−2c| = |−2b+c|</text><text x="481" y="183" font-size="16" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">|2a−c| + |−2b+c|</text><text x="481" y="211" font-size="16" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">≥ |2a−2b|</text><line x1="481" y1="234" x2="722" y2="234" stroke="#cedbe1"/><text x="481" y="271" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">a·b = −½ ⇒ |a−b| = √3</text><text x="481" y="313" font-size="19" font-weight="700" fill="#df5c4f">最小值 2√3</text><text x="481" y="338" class="u">取等时两段同向共线</text></g>
</svg>
