<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.1 的向量几何翻译</title>
  <desc id="desc">向量 b 的端点位于以 2e 为圆心、1 为半径的圆上。向量 a 位于与 e 成六十度角的射线上，最短距离由射线到圆的垂线得到。</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#0f8a72"/>
    </marker>
    <marker id="arrow-coral" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#df5c4f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
      .label { fill: #17252f; font-size: 18px; }
      .muted { fill: #63717a; font-size: 15px; }
    </style>
  </defs>

  <rect width="760" height="470" rx="18" fill="#f7faf9"/>
  <rect x="22" y="22" width="716" height="426" rx="14" fill="#fff" stroke="#dce8e4"/>

  <g aria-label="几何图形">
    <path d="M100 330H448" fill="none" stroke="#aebbc0" stroke-width="2"/>
    <path d="M100 330 222 118" fill="none" stroke="#df5c4f" stroke-width="2.2" stroke-dasharray="7 7"/>
    <circle cx="320" cy="330" r="110" fill="#eaf7f3" fill-opacity=".72" stroke="#0f8a72" stroke-width="2.5"/>
    <circle cx="320" cy="330" r="4.5" fill="#17252f"/>

    <path d="M100 330 210 330" fill="none" stroke="#0f8a72" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <path d="M100 330 155 234.7" fill="none" stroke="#df5c4f" stroke-width="3.2" marker-end="url(#arrow-coral)"/>
    <path d="M100 330 224.7 275" fill="none" stroke="#3273b9" stroke-width="3.2" marker-end="url(#arrow-blue)"/>

    <path d="M155 234.7 320 330" fill="none" stroke="#87949b" stroke-width="1.8" stroke-dasharray="5 5"/>
    <path d="M155 234.7 224.7 275" fill="none" stroke="#f09a3e" stroke-width="6" stroke-linecap="round"/>
    <path d="M161 224.3 171.4 230.3 165.4 240.7" fill="none" stroke="#17252f" stroke-width="1.6"/>
    <path d="M142 330A42 42 0 0 0 121 293.6" fill="none" stroke="#9c6dca" stroke-width="2"/>

    <circle cx="100" cy="330" r="4.5" fill="#17252f"/>
    <circle cx="155" cy="234.7" r="4.5" fill="#df5c4f"/>
    <circle cx="224.7" cy="275" r="4.5" fill="#3273b9"/>

    <text x="80" y="356" class="math label">O</text>
    <text x="137" y="222" class="math label" fill="#c9473d">A</text>
    <text x="213" y="263" class="math label" fill="#245f9e">B</text>
    <text x="328" y="352" class="math label">M</text>
    <text x="167" y="323" class="math label" fill="#0f8a72">e</text>
    <text x="119" y="265" class="math label" fill="#c9473d">a</text>
    <text x="155" y="300" class="math label" fill="#245f9e">b</text>
    <text x="125" y="306" class="sans muted" fill="#7651a8">60°</text>
    <text x="337" y="318" class="sans muted">圆心 2e</text>
    <text x="260" y="249" class="sans muted" fill="#0f8a72">半径 1</text>
  </g>

  <g aria-label="推导说明" class="sans">
    <rect x="485" y="66" width="222" height="300" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/>
    <text x="511" y="103" fill="#17252f" font-size="18" font-weight="700">把代数条件翻译成圆</text>
    <text x="511" y="142" fill="#3273b9" font-size="18" font-family="Cambria Math, Times New Roman, serif">|b − 2e|² = 1</text>
    <text x="511" y="171" class="muted">b 的端点 B 在圆上</text>
    <line x1="511" y1="198" x2="681" y2="198" stroke="#cedbe1"/>
    <text x="511" y="232" fill="#17252f" font-size="17" font-weight="700">圆心到射线的距离</text>
    <text x="511" y="267" fill="#9c6dca" font-size="18" font-family="Cambria Math, Times New Roman, serif">2 sin 60° = √3</text>
    <line x1="511" y1="294" x2="681" y2="294" stroke="#cedbe1"/>
    <text x="511" y="328" fill="#17252f" font-size="17" font-weight="700">再减去圆的半径</text>
    <text x="511" y="356" fill="#df5c4f" font-size="20" font-family="Cambria Math, Times New Roman, serif">min |a − b| = √3 − 1</text>
  </g>
</svg>
