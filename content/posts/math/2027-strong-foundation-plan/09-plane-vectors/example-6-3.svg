<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.3 的平行四边形构造</title>
  <desc id="desc">由 OA 与 OB 作平行四边形 OACB。点 P、Q 按参数 t 分别位于 OA、OB 上，再作小平行四边形 PMBQ；PQ 等于 BM，最短时 BM 垂直 OC。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="470" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="426" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g>
    <path d="M90 354 350 354 305 224 45 224Z" fill="#eef7fb" stroke="#3273b9" stroke-width="2.5"/>
    <path d="M90 354 305 224" stroke="#9aa9b0" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M90 354 45 224" stroke="#0f8a72" stroke-width="4"/><path d="M90 354 350 354" stroke="#df5c4f" stroke-width="4"/>
    <path d="M115 354 52 244 101 337 45 224" fill="none" stroke="#f09a3e" stroke-width="2.4"/>
    <path d="M45 224 101 337" stroke="#9c6dca" stroke-width="4"/>
    <path d="M96 329 107 335 101 346" fill="none" stroke="#17252f" stroke-width="1.6"/>
    <circle cx="90" cy="354" r="4"/><circle cx="350" cy="354" r="4"/><circle cx="45" cy="224" r="4"/><circle cx="305" cy="224" r="4"/><circle cx="115" cy="354" r="4" fill="#f09a3e"/><circle cx="52" cy="244" r="4" fill="#f09a3e"/><circle cx="101" cy="337" r="4" fill="#9c6dca"/>
    <text x="72" y="378" class="m l">O</text><text x="354" y="378" class="m l">A</text><text x="26" y="214" class="m l">B</text><text x="310" y="214" class="m l">C</text>
    <text x="110" y="378" class="m l">P</text><text x="35" y="265" class="m l">Q</text><text x="107" y="332" class="m l">M=H</text>
    <text x="178" y="374" class="s u" fill="#df5c4f">|OA|=2</text><text x="42" y="298" class="s u" fill="#0f8a72">|OB|=1</text>
  </g>
  <g class="s">
    <rect x="470" y="67" width="238" height="325" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/>
    <text x="495" y="105" font-size="18" font-weight="700" fill="#17252f">两次平行四边形</text>
    <text x="495" y="143" class="u">PM ∥ BQ，且 |PM|=|BQ|</text><text x="495" y="172" class="u">所以 PMBQ 为平行四边形</text>
    <text x="495" y="207" font-size="18" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">|PQ| = |BM|</text>
    <line x1="495" y1="232" x2="682" y2="232" stroke="#cedbe1"/>
    <text x="495" y="268" font-size="17" font-weight="700" fill="#17252f">最短位置</text><text x="495" y="301" class="u">当 M 与垂足 H 重合时</text>
    <text x="495" y="336" font-size="19" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">BH ⟂ OC</text>
    <text x="495" y="365" class="u">t₀ = |OH| / |OC|</text>
  </g>
</svg>
