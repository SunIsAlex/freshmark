<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.5 的极化恒等式构型</title><desc id="desc">等腰三角形 ABC 的底边 AB 被八等分，P1、P2、P3 分别距 B 八分之一、四分之一、二分之一底边。M 为 BC 中点，比较 PkM 即可比较数量积。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g>
    <path d="M70 340 410 340 240 72Z" fill="#eef7fb" stroke="#3273b9" stroke-width="2.5"/>
    <circle cx="325" cy="206" r="4.5" fill="#17252f"/><path d="M325 206 367.5 340" stroke="#f09a3e" stroke-width="3"/><path d="M325 206 325 340" stroke="#0f8a72" stroke-width="4"/><path d="M325 206 240 340" stroke="#9c6dca" stroke-width="3"/>
    <g stroke="#8d9ba2"><path d="M112.5 334V346M155 334V346M197.5 334V346M240 334V346M282.5 334V346M325 334V346M367.5 334V346"/></g>
    <circle cx="367.5" cy="340" r="4" fill="#f09a3e"/><circle cx="325" cy="340" r="4" fill="#0f8a72"/><circle cx="240" cy="340" r="4" fill="#9c6dca"/>
    <text x="52" y="363" class="m l">A</text><text x="416" y="363" class="m l">B</text><text x="230" y="61" class="m l">C</text><text x="334" y="200" class="m l">M</text>
    <text x="360" y="368" class="m l">P₁</text><text x="316" y="388" class="m l">P₂</text><text x="231" y="368" class="m l">P₃</text>
    <text x="271" y="123" class="s u">M 为 BC 中点</text>
  </g>
  <g class="s"><rect x="470" y="75" width="238" height="280" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/>
    <text x="495" y="113" font-size="18" font-weight="700" fill="#17252f">极化恒等式</text>
    <text x="495" y="151" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">Iₖ = |PₖM|² − |BM|²</text>
    <text x="495" y="184" class="u">|BM| 是定值，只需比较 PₖM</text><line x1="495" y1="209" x2="682" y2="209" stroke="#cedbe1"/>
    <text x="495" y="247" font-size="18" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">|P₃M| &gt; |P₁M| &gt; |P₂M|</text>
    <text x="495" y="287" font-size="19" font-weight="700" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">I₂ &lt; I₁ &lt; I₃</text>
  </g>
</svg>
