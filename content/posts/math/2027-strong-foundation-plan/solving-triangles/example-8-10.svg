<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
 <title id="title">例题 8.10 中线三角形</title><desc id="desc">左侧为按题设比例绘制的示意图，右侧为简要推导思路。</desc>
 <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#2878b8"/></marker><style>
 .sans{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.math,.pt,.len{font-family:"Cambria Math","Times New Roman","Microsoft YaHei",serif}.edge{stroke:#17252f;stroke-width:2.6;fill:none;stroke-linecap:round}.aux{stroke:#0b9077;stroke-width:2.2;fill:none;stroke-dasharray:7 5}.accent{stroke:#2878b8;stroke-width:3;fill:none}.shape{fill:#eaf7f3;stroke:#17252f;stroke-width:2.5}.pt{font-size:19px;font-style:italic;fill:#17252f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.len{font-size:16px;fill:#51656d;paint-order:stroke;stroke:#fff;stroke-width:5px}.small{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#65747d;paint-order:stroke;stroke:#fff;stroke-width:4px}.panel-title{font-size:21px;font-weight:700;fill:#17252f}.note{font-size:17px;fill:#536970}.formula{font:18px "Cambria Math","Times New Roman","Microsoft YaHei",serif;fill:#2878b8}.result{font-size:19px;font-weight:700;fill:#0b9077}.warn{font-size:18px;font-weight:700;fill:#e85d4a}
 </style></defs>
 <rect width="900" height="430" rx="20" fill="#f7faf9"/><rect x="20" y="20" width="860" height="390" rx="16" fill="#fff" stroke="#dce8e4"/>
 <g><polygon points="90,330 410,330 205,90" class="shape" /><line x1="90" y1="330" x2="307.5" y2="210" class="aux" /><line x1="410" y1="330" x2="147.5" y2="210" class="aux" /><line x1="205" y1="90" x2="250" y2="330" class="aux" /><polygon points="150,305 330,305 150,170" class="" fill="#fff3e8" stroke="#e85d4a" stroke-width="2.5"/><text x="211" y="325" class="len" >9</text><text x="133" y="240" class="len" >12</text><text x="246" y="231" class="len" >15</text><text x="101" y="160" class="small" >三条中线组成直角三角形</text></g><g class="sans"><rect x="545" y="55" width="315" height="320" rx="18" fill="#f1f6fa" stroke="#d7e3e8"/><text x="574" y="98" class="panel-title">中线三角形</text><line x1="574" y1="119" x2="831" y2="119" stroke="#cedbe1"/><text x="574" y="157" class="formula">9²+12²=15²</text><text x="574" y="205" class="formula">中线三角形面积 = 54</text><text x="574" y="253" class="note">S中线 : S原 = 3 : 4</text><text x="574" y="301" class="result">S原 = 72</text></g>
