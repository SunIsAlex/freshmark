 <g><polygon points="70,335 455,335 250,75" class="shape" /><line x1="250" y1="75" x2="250" y2="335" class="aux" /><line x1="70" y1="335" x2="316" y2="158" class="aux" /><line x1="455" y1="335" x2="174" y2="177" class="aux" /><text x="52" y="359" class="pt" >A</text><text x="462" y="359" class="pt" >B</text><text x="243" y="62" class="pt" >C</text><text x="262" y="220" class="len" >10</text><text x="149" y="247" class="len" >20</text><text x="339" y="253" class="len" >x</text></g><g class="sans"><rect x="545" y="55" width="315" height="320" rx="18" fill="#f1f6fa" stroke="#d7e3e8"/><text x="574" y="98" class="panel-title">高与边成反比</text><line x1="574" y1="119" x2="831" y2="119" stroke="#cedbe1"/><text x="574" y="157" class="formula">a:b:c = 1/10 : 1/20 : 1/x</text><text x="574" y="205" class="note">倒数仍须满足三角形不等式</text><text x="574" y="253" class="formula">1/20 &lt; 1/x &lt; 3/20</text><text x="574" y="301" class="result">20/3 &lt; x &lt; 20</text></g>
