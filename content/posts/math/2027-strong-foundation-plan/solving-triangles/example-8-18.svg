 <g><path d="M85 340H470M85 340V70" stroke="#aabcc3" stroke-width="2"/><circle cx="115" cy="270" r="5" fill="#e85d4a"/><circle cx="115" cy="225" r="5" fill="#2878b8"/><circle cx="180" cy="225" r="5" fill="#e85d4a"/><circle cx="115" cy="180" r="5" fill="#2878b8"/><circle cx="180" cy="180" r="5" fill="#2878b8"/><circle cx="245" cy="180" r="5" fill="#e85d4a"/><circle cx="115" cy="135" r="5" fill="#2878b8"/><circle cx="180" cy="135" r="5" fill="#2878b8"/><circle cx="245" cy="135" r="5" fill="#2878b8"/><circle cx="310" cy="135" r="5" fill="#e85d4a"/><circle cx="115" cy="90" r="5" fill="#2878b8"/><circle cx="180" cy="90" r="5" fill="#2878b8"/><circle cx="245" cy="90" r="5" fill="#2878b8"/><circle cx="310" cy="90" r="5" fill="#2878b8"/><circle cx="375" cy="90" r="5" fill="#e85d4a"/><text x="260" y="367" class="small" >c=n, n+1, …, n+a−1</text><text x="45" y="100" class="pt" >a</text><text x="454" y="365" class="pt" >c</text><text x="105" y="293" class="len" >1</text><text x="105" y="248" class="len" >2</text><text x="105" y="203" class="len" >3</text><text x="105" y="158" class="len" >4</text><text x="105" y="113" class="len" >n</text></g><g class="sans"><rect x="545" y="55" width="315" height="320" rx="18" fill="#f1f6fa" stroke="#d7e3e8"/><text x="574" y="98" class="panel-title">整数边计数</text><line x1="574" y1="119" x2="831" y2="119" stroke="#cedbe1"/><text x="574" y="157" class="note">固定 a∈{1,…,n}</text><text x="574" y="205" class="formula">n ≤ c ≤ n+a−1</text><text x="574" y="253" class="note">每个 a 对应 a 种 c</text><text x="574" y="301" class="result">总数 1+2+…+n = n(n+1)/2</text></g>
