<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">双曲线的焦点三角形与切线夹角</title>
  <desc id="desc">双曲线靠近焦点 F1 的一支上，PF2 减 PF1 等于 2a。速度沿切线，焦点三角形的半角给出速度与位矢夹角。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
      .label{font-size:20px;font-weight:650}
      .note{font-size:17px;fill:#526176}
      .formula{font-size:22px;font-family:"Cambria Math","Times New Roman",serif}
    </style>
  </defs>
  <rect width="920" height="560" fill="#f7faf9"/>
  <rect x="22" y="22" width="876" height="516" rx="20" fill="#fff" stroke="#dce8e4" stroke-width="2"/>

  <text x="54" y="62" font-size="25" font-weight="750">双曲线：距离差固定，切线平分焦线夹角</text>
  <text x="54" y="90" class="note">图示右支；F₁ 是靠近这一支的引力中心。</text>

  <line x1="92" y1="292" x2="830" y2="292" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="7 7"/>
  <line x1="390" y1="82" x2="760" y2="520" stroke="#d7dee3" stroke-width="1.5" stroke-dasharray="8 8"/>
  <line x1="390" y1="502" x2="760" y2="64" stroke="#d7dee3" stroke-width="1.5" stroke-dasharray="8 8"/>
  <path d="M662 86 C610 129 562 202 540 292 C562 382 610 455 662 498"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <circle cx="198" cy="292" r="7" fill="#dc2626"/>
  <circle cx="582" cy="292" r="7" fill="#dc2626"/>
  <circle cx="578" cy="383" r="8" fill="#0f766e"/>
  <text x="175" y="324" class="math label">F₂</text>
  <text x="592" y="287" class="math label">F₁</text>
  <text x="586" y="407" class="math label">P</text>

  <path d="M198 292 578 383 582 292" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="368" y="353" class="math label" fill="#b91c1c" transform="rotate(13 368 353)">r + 2a</text>
  <text x="599" y="345" class="math label" fill="#b91c1c" transform="rotate(-88 599 345)">r</text>
  <path d="M198 310H582" stroke="#dc2626" stroke-width="1.7"/>
  <path d="M198 303V317M582 303V317" stroke="#dc2626" stroke-width="1.7"/>
  <text x="368" y="337" class="math label" fill="#b91c1c">2c</text>

  <line x1="428" y1="184" x2="730" y2="518" stroke="#ea580c" stroke-width="3"/>
  <line x1="578" y1="383" x2="683" y2="499" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="702" y="508" class="math label" fill="#c2410c">v</text>
  <line x1="582" y1="292" x2="578" y2="368" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="596" y="370" class="math label" fill="#1d4ed8">r</text>

  <path d="M578 353 A30 30 0 0 1 596 363" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="602" y="357" class="math label" fill="#6d28d9">θ</text>
  <path d="M553 377 A43 43 0 0 0 578 340" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <text x="538" y="354" class="math label" fill="#0f766e">α</text>

  <rect x="92" y="430" width="704" height="78" rx="15" fill="#f8fafc" stroke="#dbe4ea"/>
  <text x="118" y="461" class="formula">PF₂ − PF₁ = 2a</text>
  <text x="118" y="491" class="formula">sin θ = sin(α/2) = b / √[r(r + 2a)]</text>
  <text x="637" y="462" class="note">b² = c² − a²</text>
</svg>
