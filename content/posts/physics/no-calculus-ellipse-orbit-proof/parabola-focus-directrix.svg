<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">抛物线的焦点、准线与切线夹角</title>
  <desc id="desc">抛物线上点 P 到焦点 F 和准线垂足 H 的距离相等。速度沿切线，切线平分 PF 与平行于轴的 PH 所成夹角。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
      .label{font-size:20px;font-weight:650}
      .note{font-size:17px;fill:#526176}
      .formula{font-size:22px;font-family:"Cambria Math","Times New Roman",serif}
    </style>
  </defs>
  <rect width="920" height="560" fill="#f7faf9"/>
  <rect x="22" y="22" width="876" height="516" rx="20" fill="#fff" stroke="#dce8e4" stroke-width="2"/>

  <text x="54" y="62" font-size="25" font-weight="750">抛物线：到焦点与准线等距</text>
  <text x="54" y="90" class="note">PH 平行于轴；绿色直角说明 H 是准线垂足。</text>

  <line x1="94" y1="292" x2="792" y2="292" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="7 7"/>
  <line x1="698" y1="112" x2="698" y2="466" stroke="#7c3aed" stroke-width="3"/>
  <text x="715" y="135" class="math label" fill="#6d28d9">准线 d</text>
  <path d="M332 92 C422 154 480 222 498 292 C480 362 422 430 332 492"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <circle cx="368" cy="292" r="7" fill="#dc2626"/>
  <circle cx="430" cy="118" r="8" fill="#0f766e"/>
  <circle cx="698" cy="118" r="7" fill="#7c3aed"/>
  <text x="345" y="322" class="math label">F</text>
  <text x="405" y="109" class="math label">P</text>
  <text x="710" y="124" class="math label">H</text>

  <line x1="430" y1="118" x2="368" y2="292" stroke="#dc2626" stroke-width="2.8"/>
  <line x1="430" y1="118" x2="698" y2="118" stroke="#dc2626" stroke-width="2.8"/>
  <text x="374" y="205" class="math label" fill="#b91c1c" transform="rotate(-70 374 205)">PF = r</text>
  <text x="528" y="106" class="math label" fill="#b91c1c">PH = r</text>
  <path d="M680 118V136H698" fill="none" stroke="#0f766e" stroke-width="2.4"/>

  <line x1="330" y1="0" x2="631" y2="502" stroke="#ea580c" stroke-width="3"/>
  <line x1="430" y1="118" x2="521" y2="270" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="531" y="282" class="math label" fill="#c2410c">v</text>
  <line x1="368" y1="292" x2="425" y2="134" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="383" y="245" class="math label" fill="#1d4ed8">r</text>

  <path d="M447 147 A34 34 0 0 0 468 120" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <text x="469" y="150" class="math label" fill="#0f766e">α/2</text>
  <path d="M413 166 A52 52 0 0 1 448 156" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="424" y="188" class="math label" fill="#6d28d9">θ</text>

  <path d="M368 310H698" stroke="#475569" stroke-width="1.7"/>
  <path d="M368 303V317M698 303V317" stroke="#475569" stroke-width="1.7"/>
  <text x="519" y="337" class="math label">p</text>

  <rect x="92" y="404" width="704" height="92" rx="15" fill="#f8fafc" stroke="#dbe4ea"/>
  <text x="118" y="438" class="formula">PF = PH = r,   p = r(1 + cos ν)</text>
  <text x="118" y="474" class="formula">sin² θ = cos²(ν/2) = p/(2r)</text>
</svg>
