<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.14 的内心向量模型</title><desc id="desc">边长为 2、3、4 的三角形及其内切圆，内心的位置向量由对边边长加权。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M65 340 390 340 195 78Z" fill="#edf8f5" stroke="#17252f" stroke-width="2.3"/><circle cx="210" cy="250" r="90" fill="none" stroke="#0f8a72" stroke-width="2.3"/><path d="M65 340 210 250" stroke="#3273b9" stroke-width="3" marker-end="url(#a)"/><path d="M210 250 210 340" stroke="#df5c4f" stroke-width="2" stroke-dasharray="5 4"/><path d="M210 322H228V340" fill="none" stroke="#17252f" stroke-width="1.5"/>
    <text x="48" y="364" class="m l">A</text><text x="397" y="364" class="m l">B</text><text x="187" y="65" class="m l">C</text><text x="220" y="246" class="m l">O</text><text x="203" y="363" class="m l">H</text><text x="225" y="301" class="m l" fill="#df5c4f">r</text>
    <text x="219" y="362" class="s u">AB = 2</text><text x="294" y="199" class="s u">BC = 4</text><text x="99" y="199" class="s u">AC = 3</text>
  </g>
  <g class="s"><rect x="450" y="72" width="258" height="286" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="476" y="110" font-size="18" font-weight="700" fill="#17252f">内心的边长权重</text><text x="476" y="153" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">4 OA + 3 OB + 2 OC = 0</text><line x1="476" y1="178" x2="682" y2="178" stroke="#cedbe1"/><text x="476" y="218" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">AO = ⁵⁄₉ AB + ²⁄₉ BC</text><text x="476" y="258" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">3λ + 6μ = 3</text><text x="476" y="302" class="u">OH ⟂ AB，且 AH = p − a</text><text x="476" y="333" font-size="18" font-weight="700" fill="#0f8a72">选择 C</text></g>
</svg>
