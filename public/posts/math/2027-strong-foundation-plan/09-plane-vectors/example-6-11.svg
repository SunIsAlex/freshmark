<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.11 的单位圆点系图</title><desc id="desc">单位圆上取任意点 P，并连接到正 n 边形各顶点。正多边形顶点向量和为零，因此所有距离平方和恒等于二 n。</desc>
  <defs><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="430" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="386" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g>
    <circle cx="245" cy="220" r="145" fill="#eef7fb" stroke="#3273b9" stroke-width="2.5"/>
    <path d="M245 75 370.6 147.5 370.6 292.5 245 365 119.4 292.5 119.4 147.5Z" fill="none" stroke="#0f8a72" stroke-width="2"/>
    <g stroke="#9c6dca" stroke-width="1.7" stroke-dasharray="4 4"><path d="M381.2 170.4 245 75M381.2 170.4 370.6 147.5M381.2 170.4 370.6 292.5M381.2 170.4 245 365M381.2 170.4 119.4 292.5M381.2 170.4 119.4 147.5"/></g>
    <circle cx="245" cy="220" r="4.5" fill="#17252f"/><circle cx="381.2" cy="170.4" r="5" fill="#df5c4f"/>
    <g fill="#0f8a72"><circle cx="245" cy="75" r="4"/><circle cx="370.6" cy="147.5" r="4"/><circle cx="370.6" cy="292.5" r="4"/><circle cx="245" cy="365" r="4"/><circle cx="119.4" cy="292.5" r="4"/><circle cx="119.4" cy="147.5" r="4"/></g>
    <text x="230" y="242" class="m l">O</text><text x="390" y="167" class="m l" fill="#c9473d">P</text><text x="252" y="68" class="m l">P₁</text><text x="379" y="146" class="m l">P₂</text><text x="379" y="310" class="m l">P₃</text><text x="91" y="144" class="m l">Pₙ</text>
  </g>
  <g class="s"><rect x="470" y="70" width="238" height="290" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/>
    <text x="495" y="108" font-size="18" font-weight="700" fill="#17252f">正多边形的向量和为零</text><text x="495" y="150" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">Σ OPᵢ = 0</text>
    <text x="495" y="187" class="u">单位圆上 |OP|=|OPᵢ|=1</text><line x1="495" y1="212" x2="682" y2="212" stroke="#cedbe1"/>
    <text x="495" y="248" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">Σ PPᵢ²</text><text x="495" y="280" class="u">= 2n − 2 OP·ΣOPᵢ</text>
    <text x="495" y="324" font-size="21" font-weight="700" fill="#9c6dca">= 2n</text>
  </g>
</svg>
