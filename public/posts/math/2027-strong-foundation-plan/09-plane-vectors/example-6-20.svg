<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.20 的向量合成模型</title><desc id="desc">单位向量 b 与 a 加 c 的方向一致时，b 与 a 加 c 的数量积达到最大值。</desc>
  <defs><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#0f8a72"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#df5c4f"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="780" height="420" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="736" height="376" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M75 330 195 330" stroke="#3273b9" stroke-width="3" marker-end="url(#ab)"/><path d="M75 330 250 95" stroke="#0f8a72" stroke-width="3" marker-end="url(#ag)"/><path d="M195 330 370 95" stroke="#0f8a72" stroke-width="2" stroke-dasharray="6 4"/><path d="M250 95 370 95" stroke="#3273b9" stroke-width="2" stroke-dasharray="6 4"/><path d="M75 330 370 95" stroke="#df5c4f" stroke-width="4" marker-end="url(#ar)"/><path d="M124 330A49 49 0 0 0 104 291" fill="none" stroke="#9c6dca" stroke-width="2"/>
    <text x="61" y="354" class="m l">O</text><text x="130" y="319" class="m l" fill="#3273b9">a</text><text x="143" y="194" class="m l" fill="#0f8a72">c</text><text x="249" y="190" class="m l" fill="#df5c4f">b ∥ a+c</text><text x="108" y="297" class="m l" fill="#9c6dca">α</text>
  </g>
  <g class="s"><rect x="450" y="70" width="282" height="275" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="476" y="108" font-size="18" font-weight="700" fill="#17252f">绝对值对应四种符号组合</text><text x="476" y="149" font-size="16" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">max b·(±a ± c)</text><text x="476" y="185" class="u">比较 |a+c| 与 |a−c|</text><line x1="476" y1="208" x2="706" y2="208" stroke="#cedbe1"/><text x="476" y="246" font-size="17" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">|a+c|² = 1+26+2 = 29</text><text x="476" y="286" font-size="17" fill="#9c6dca" font-family="Cambria Math,Times New Roman,serif">cos α = 1/√26</text><text x="476" y="322" font-size="19" font-weight="700" fill="#df5c4f">最大值 √29</text></g>
</svg>
