<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">例题 6.18 的柯西不等式几何图</title><desc id="desc">向量 u 在向量 v 方向上的投影长度不超过 u 的模，由此得到二维柯西不等式。</desc>
  <defs><marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3273b9"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#0f8a72"/></marker><style>.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}.l{font-size:18px;fill:#17252f}.u{font-size:15px;fill:#65747d}</style></defs>
  <rect width="760" height="410" rx="18" fill="#f7faf9"/><rect x="22" y="22" width="716" height="366" rx="14" fill="#fff" stroke="#dce8e4"/>
  <g><path d="M65 320H410" stroke="#aebbc0" stroke-width="2"/><path d="M85 320 380 320" stroke="#0f8a72" stroke-width="3" marker-end="url(#ag)"/><path d="M85 320 300 95" stroke="#3273b9" stroke-width="3" marker-end="url(#ab)"/><path d="M300 95V320" stroke="#df5c4f" stroke-width="2" stroke-dasharray="6 4"/><path d="M300 302H318V320" fill="none" stroke="#17252f" stroke-width="1.5"/><path d="M139 320A54 54 0 0 0 122 281" fill="none" stroke="#9c6dca" stroke-width="2"/>
    <text x="75" y="345" class="m l">O</text><text x="335" y="309" class="m l" fill="#0f8a72">v</text><text x="198" y="189" class="m l" fill="#3273b9">u</text><text x="124" y="288" class="m l" fill="#9c6dca">θ</text><text x="307" y="210" class="s u" fill="#df5c4f">垂直分量</text><text x="178" y="345" class="s u">|u| cos θ</text>
  </g>
  <g class="s"><rect x="455" y="70" width="253" height="270" rx="14" fill="#f1f6fa" stroke="#d8e3ea"/><text x="480" y="109" font-size="18" font-weight="700" fill="#17252f">投影不会比原向量更长</text><text x="480" y="151" font-size="17" fill="#3273b9" font-family="Cambria Math,Times New Roman,serif">|u·v| ≤ |u||v|</text><line x1="480" y1="178" x2="682" y2="178" stroke="#cedbe1"/><text x="480" y="218" font-size="16" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">(ac + bd)²</text><text x="480" y="248" font-size="16" fill="#0f8a72" font-family="Cambria Math,Times New Roman,serif">≤ (a²+b²)(c²+d²)</text><text x="480" y="292" class="u">等号 ⇔ u ∥ v</text><text x="480" y="320" class="u">即两向量方向相同或相反</text></g>
</svg>
