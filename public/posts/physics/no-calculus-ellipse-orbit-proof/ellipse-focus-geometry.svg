<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">椭圆焦点几何与 P 点角度关系</title>
  <desc id="desc">左侧主图显示椭圆、两个焦点、焦点三角形与 P 点切线；右侧放大图将焦点夹角 alpha 和速度位矢夹角 theta 分开标注。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
      .label{font-size:19px;font-weight:650}
      .small{font-size:16px;fill:#526176}
      .formula{font-size:21px;font-family:"Cambria Math","Times New Roman",serif}
      .green{fill:#0f766e}.purple{fill:#7c3aed}
    </style>
  </defs>
  <rect width="1000" height="600" fill="#f7faf9"/>
  <rect x="22" y="22" width="956" height="556" rx="20" fill="#fff" stroke="#dce8e4" stroke-width="2"/>
  <text x="54" y="64" font-size="26" font-weight="750">椭圆 · 距离和固定</text>
  <text x="54" y="93" class="small">先读左侧距离关系，再看右侧 P 点局部角度。</text>

  <!-- Main construction -->
  <rect x="52" y="116" width="590" height="350" rx="16" fill="#fbfdff" stroke="#e2e8f0"/>
  <ellipse cx="340" cy="286" rx="248" ry="124" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <line x1="76" y1="286" x2="604" y2="286" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 7"/>
  <circle cx="125" cy="286" r="7" fill="#dc2626"/>
  <circle cx="555" cy="286" r="7" fill="#dc2626"/>
  <circle cx="478" cy="185" r="8" fill="#0f766e"/>
  <text x="103" y="316" class="math label">F₁</text>
  <text x="563" y="316" class="math label">F₂</text>
  <text x="488" y="176" class="math label">P</text>
  <path d="M125 286 478 185 555 286" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="535" y="225" class="math label">2a − r</text>
  <line x1="298" y1="122" x2="626" y2="237" stroke="#ea580c" stroke-width="3"/>
  <line x1="478" y1="185" x2="586" y2="223" stroke="#ea580c" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="596" y="231" class="math label">v</text>
  <line x1="125" y1="286" x2="465" y2="189" stroke="#2563eb" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="399" y="187" class="math label">r</text>
  <path d="M125 331H555M125 324V338M555 324V338" stroke="#64748b" stroke-width="1.6"/>
  <text x="322" y="357" class="math label">F₁F₂ = 2c</text>
  <rect x="83" y="392" width="528" height="50" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="111" y="424" class="formula">PF₁ + PF₂ = r + (2a − r) = 2a</text>

  <!-- Angle inset -->
  <rect x="670" y="116" width="278" height="350" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="696" y="149" font-size="19" font-weight="700">P 点局部放大</text>
  <text x="696" y="173" class="small">两种角度分区标注</text>
  <circle cx="808" cy="288" r="7" fill="#0f766e"/>
  <text x="817" y="282" class="math label">P</text>
  <line x1="808" y1="288" x2="701" y2="327" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="808" y1="288" x2="862" y2="363" stroke="#dc2626" stroke-width="2.5"/>
  <text x="683" y="347" class="math label">PF₁</text>
  <text x="858" y="388" class="math label">PF₂</text>
  <line x1="737" y1="263" x2="912" y2="324" stroke="#ea580c" stroke-width="3"/>
  <line x1="808" y1="288" x2="899" y2="320" stroke="#ea580c" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="908" y="328" class="math label">v</text>
  <line x1="808" y1="288" x2="888" y2="259" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="891" y="256" class="math label">r</text>
  <path d="M780 298 A30 30 0 0 0 825 311" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="789" y="336" class="math label green">α</text>
  <path d="M846 274 A40 40 0 0 1 846 301" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="856" y="288" class="math label purple">θ</text>
  <text x="694" y="420" class="small">绿色：焦点夹角 α</text>
  <text x="694" y="446" class="small">紫色：位矢—速度夹角 θ</text>

  <rect x="52" y="490" width="896" height="60" rx="14" fill="#f1f5f9" stroke="#dbe4ea"/>
  <text x="78" y="527" class="formula">sin θ = cos(α/2) = b / √[r(2a − r)]　　b² = a² − c²</text>
</svg>
