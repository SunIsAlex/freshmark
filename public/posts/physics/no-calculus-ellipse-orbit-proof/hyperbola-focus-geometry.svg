<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">双曲线焦点几何与 P 点角度关系</title>
  <desc id="desc">左侧主图只显示双曲线右支、两个焦点、距离差和切线；右侧放大图将焦点夹角 alpha 和速度位矢夹角 theta 分开标注。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 9 3 0 6Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .math{font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
      .label{font-size:19px;font-weight:650}
      .small{font-size:16px;fill:#526176}
      .formula{font-size:21px;font-family:"Cambria Math","Times New Roman",serif}
      .green{fill:#0f766e}.purple{fill:#7c3aed}
    </style>
  </defs>
  <rect width="1000" height="600" fill="#f7faf9"/>
  <rect x="22" y="22" width="956" height="556" rx="20" fill="#fff" stroke="#dce8e4" stroke-width="2"/>
  <text x="54" y="64" font-size="26" font-weight="750">双曲线 · 距离差固定</text>
  <text x="54" y="93" class="small">只画靠近引力中心 F₁ 的右支，避免两支造成视觉干扰。</text>

  <!-- Main construction -->
  <rect x="52" y="116" width="590" height="350" rx="16" fill="#fbfdff" stroke="#e2e8f0"/>
  <line x1="76" y1="300" x2="615" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 7"/>
  <line x1="310" y1="130" x2="600" y2="473" stroke="#d7dee3" stroke-width="1.4" stroke-dasharray="8 8"/>
  <line x1="310" y1="470" x2="600" y2="127" stroke="#d7dee3" stroke-width="1.4" stroke-dasharray="8 8"/>
  <path d="M560 153 C515 190 478 246 460 300 C478 354 515 410 560 447"
        fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="124" cy="300" r="7" fill="#dc2626"/>
  <circle cx="496" cy="300" r="7" fill="#dc2626"/>
  <circle cx="498" cy="384" r="8" fill="#0f766e"/>
  <text x="101" y="330" class="math label">F₂</text>
  <text x="505" y="293" class="math label">F₁</text>
  <text x="507" y="408" class="math label">P</text>
  <path d="M124 300 498 384 496 300" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="270" y="326" class="math label">r + 2a</text>
  <line x1="124" y1="337" x2="496" y2="337" stroke="#64748b" stroke-width="1.6"/>
  <path d="M124 330V344M496 330V344" stroke="#64748b" stroke-width="1.6"/>
  <text x="292" y="365" class="math label">2c</text>
  <line x1="398" y1="263" x2="565" y2="466" stroke="#ea580c" stroke-width="3"/>
  <line x1="498" y1="384" x2="551" y2="448" stroke="#ea580c" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="560" y="455" class="math label">v</text>
  <line x1="496" y1="300" x2="498" y2="369" stroke="#2563eb" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="511" y="376" class="math label">r</text>
  <rect x="83" y="400" width="290" height="44" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="108" y="429" class="formula">PF₂ − PF₁ = 2a</text>

  <!-- Angle inset -->
  <rect x="670" y="116" width="278" height="350" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="696" y="149" font-size="19" font-weight="700">P 点局部放大</text>
  <text x="696" y="173" class="small">上方看 α，下方看 θ</text>
  <circle cx="808" cy="288" r="7" fill="#0f766e"/>
  <text x="818" y="283" class="math label">P</text>
  <line x1="808" y1="288" x2="806" y2="205" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="808" y1="288" x2="710" y2="265" stroke="#dc2626" stroke-width="2.5"/>
  <text x="795" y="198" class="math label">PF₁</text>
  <text x="681" y="260" class="math label">PF₂</text>
  <line x1="738" y1="203" x2="900" y2="401" stroke="#ea580c" stroke-width="3"/>
  <line x1="808" y1="288" x2="880" y2="376" stroke="#ea580c" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="889" y="391" class="math label">v</text>
  <line x1="808" y1="288" x2="810" y2="378" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="792" y="401" class="math label">r</text>
  <path d="M779 281 A30 30 0 0 1 808 258" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="763" y="241" class="math label green">α</text>
  <path d="M809 327 A40 40 0 0 0 833 319" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="836" y="340" class="math label purple">θ</text>
  <text x="694" y="420" class="small">α：两条焦半径的夹角</text>
  <text x="694" y="446" class="small">θ：位矢与速度的夹角</text>

  <rect x="52" y="490" width="896" height="60" rx="14" fill="#f1f5f9" stroke="#dbe4ea"/>
  <text x="78" y="527" class="formula">sin θ = sin(α/2) = b / √[r(r + 2a)]　　b² = c² − a²</text>
</svg>
