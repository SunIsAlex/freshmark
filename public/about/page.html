<meta data-alternate="https://freshmark.sunisalex.org/en/about/" data-article="false" data-canonical="https://freshmark.sunisalex.org/about/" data-description="从数学推导到物理直觉，从化学反应到技术实践：这里收藏值得慢慢想明白的问题。" data-freshmark-page data-title="关于 — Freshmark"><main><header class="article-header container"><p class="eyebrow">关于这里</p><h1>一个尊重你注意力的博客。</h1><p class="article-dek">从数学推导到物理直觉，从化学反应到技术实践：这里收藏值得慢慢想明白的问题。</p></header><div class="article-wrap"><aside class="toc"><p>初衷</p><a href="#principles">原则</a><a href="#contact">联系</a></aside><article class="prose"><p>这个博客源于一个简单的信念：网络阅读应该清晰、温暖而从容。这里没有广告、弹窗或第三方追踪；可选的同源统计只保存汇总数字，评论账号邮箱不会公开，密码仅保存为加盐哈希。</p><h2 id="principles">原则</h2><ul><li>让排版承担设计。</li><li>每项功能都应有存在的理由。</li><li>好的默认设置让发布更轻松。</li><li>网站应在任何屏幕上都保持舒适。</li></ul><h2 id="contact">联系</h2><p>可以在 scripts/build.mjs 中替换这段文字，加入你的自我介绍和联系方式。</p></article></div></main>
