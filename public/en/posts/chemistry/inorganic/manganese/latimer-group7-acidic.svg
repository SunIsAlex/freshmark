<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Latimer diagram of manganese, technetium, and rhenium in acidic solution</title>
  <desc id="desc">Standard reduction potentials versus the standard hydrogen electrode for Group 7 elements, based on the official 2023 International Chemistry Olympiad data. Missing values in the original question are completed as 0.74 volt and 0.31 volt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:Inter,"Noto Sans",Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:700}
      .subtitle{font-size:18px;fill:#526176}
      .state{font-size:18px;font-weight:700;fill:#d33a2c}
      .row-label{font-size:25px;font-weight:750;fill:#ff4500}
      .species{font-size:27px;font-weight:600}
      .potential{font-size:20px;font-weight:700;fill:#334155}
      .summary{font-size:17px;fill:#42526a}
      .source{font-size:15px;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .row{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.5}
      .arrow{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text class="title" x="60" y="58">Group 7 Latimer diagram · acidic / 锰副族 · 酸性</text>
  <text class="subtitle" x="60" y="90">E° versus SHE, in volts · reduction proceeds from left to right</text>

  <text class="state" x="210" y="130" text-anchor="middle">+VII</text>
  <text class="state" x="470" y="130" text-anchor="middle">+VI</text>
  <text class="state" x="730" y="130" text-anchor="middle">+IV</text>
  <text class="state" x="990" y="130" text-anchor="middle">0</text>

  <rect class="row" x="45" y="150" width="1110" height="160" rx="14"/>
  <text class="row-label" x="78" y="225">Mn</text>
  <rect class="node" x="130" y="185" width="160" height="54" rx="9"/>
  <rect class="node" x="390" y="185" width="160" height="54" rx="9"/>
  <rect class="node" x="650" y="185" width="160" height="54" rx="9"/>
  <rect class="node" x="910" y="185" width="160" height="54" rx="9"/>
  <text class="species" x="210" y="220" text-anchor="middle">MnO₄⁻</text>
  <text class="species" x="470" y="220" text-anchor="middle">MnO₄²⁻</text>
  <text class="species" x="730" y="220" text-anchor="middle">MnO₂</text>
  <text class="species" x="990" y="220" text-anchor="middle">Mn</text>
  <line class="arrow" x1="292" y1="212" x2="382" y2="212"/>
  <line class="arrow" x1="552" y1="212" x2="642" y2="212"/>
  <line class="arrow" x1="812" y1="212" x2="902" y2="212"/>
  <text class="potential" x="337" y="198" text-anchor="middle">+0.90</text>
  <text class="potential" x="597" y="198" text-anchor="middle">+2.09</text>
  <text class="potential" x="857" y="198" text-anchor="middle">+0.43</text>
  <text class="summary" x="210" y="278">E°(MnO₄⁻/MnO₂) = +1.69</text>
  <text class="summary" x="620" y="278">E°(MnO₄⁻/Mn) = +1.06</text>

  <rect class="row" x="45" y="330" width="1110" height="160" rx="14"/>
  <text class="row-label" x="78" y="405">Tc</text>
  <rect class="node" x="130" y="365" width="160" height="54" rx="9"/>
  <rect class="node" x="390" y="365" width="160" height="54" rx="9"/>
  <rect class="node" x="650" y="365" width="160" height="54" rx="9"/>
  <rect class="node" x="910" y="365" width="160" height="54" rx="9"/>
  <text class="species" x="210" y="400" text-anchor="middle">TcO₄⁻</text>
  <text class="species" x="470" y="400" text-anchor="middle">TcO₄²⁻</text>
  <text class="species" x="730" y="400" text-anchor="middle">TcO₂</text>
  <text class="species" x="990" y="400" text-anchor="middle">Tc</text>
  <line class="arrow" x1="292" y1="392" x2="382" y2="392"/>
  <line class="arrow" x1="552" y1="392" x2="642" y2="392"/>
  <line class="arrow" x1="812" y1="392" x2="902" y2="392"/>
  <text class="potential" x="337" y="378" text-anchor="middle">−0.57</text>
  <text class="potential" x="597" y="378" text-anchor="middle">+1.39</text>
  <text class="potential" x="857" y="378" text-anchor="middle">+0.27</text>
  <text class="summary" x="210" y="458">E°(TcO₄⁻/TcO₂) = +0.74</text>
  <text class="summary" x="620" y="458">E°(TcO₄⁻/Tc) = +0.50</text>

  <rect class="row" x="45" y="510" width="1110" height="160" rx="14"/>
  <text class="row-label" x="78" y="585">Re</text>
  <rect class="node" x="130" y="545" width="160" height="54" rx="9"/>
  <rect class="node" x="390" y="545" width="160" height="54" rx="9"/>
  <rect class="node" x="650" y="545" width="160" height="54" rx="9"/>
  <rect class="node" x="910" y="545" width="160" height="54" rx="9"/>
  <text class="species" x="210" y="580" text-anchor="middle">ReO₄⁻</text>
  <text class="species" x="470" y="580" text-anchor="middle">ReO₃</text>
  <text class="species" x="730" y="580" text-anchor="middle">ReO₂</text>
  <text class="species" x="990" y="580" text-anchor="middle">Re</text>
  <line class="arrow" x1="292" y1="572" x2="382" y2="572"/>
  <line class="arrow" x1="552" y1="572" x2="642" y2="572"/>
  <line class="arrow" x1="812" y1="572" x2="902" y2="572"/>
  <text class="potential" x="337" y="558" text-anchor="middle">+0.76</text>
  <text class="potential" x="597" y="558" text-anchor="middle">+0.40</text>
  <text class="potential" x="857" y="558" text-anchor="middle">+0.31</text>
  <text class="summary" x="210" y="638">E°(ReO₄⁻/ReO₂) = +0.52</text>
  <text class="summary" x="620" y="638">E°(ReO₄⁻/Re) = +0.40</text>

  <line x1="60" y1="704" x2="1140" y2="704" stroke="#e2e8f0"/>
  <text class="source" x="60" y="726">Data: 55th International Chemistry Olympiad (2023), official Problem 1 and official solution.</text>
  <text class="source" x="60" y="748">The +0.74 V and +0.31 V entries complete the two values omitted in the question.</text>
</svg>
